name: Scrape & Deploy

on:
  schedule:
    - cron: '0 7 * * *'   # tous les jours à 7h UTC
  workflow_dispatch:          # déclenchement manuel depuis l'UI GitHub
  push:
    branches: [main]
    paths-ignore:
      - 'data/projects.json'
      - 'data/meta.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/scraper.py

      - name: Commit updated data
        run: |
          git config user.name "DC Intel Bot"
          git config user.email "bot@dc-intel.local"
          git add data/projects.json data/meta.json
          git diff --staged --quiet || git commit -m "chore: update projects data [$(date -u '+%Y-%m-%d %H:%M')] UTC"
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
